name: Dirig Software
description: 'Dirig Software, Inc. was a Nashua, New Hampshire software company that
  built application and system management software for eBusiness — agent-based performance
  monitoring and automated problem correction for J2EE application servers (WebLogic,
  WebSphere), web infrastructure, and hosted service-provider environments, sold both
  direct to enterprises and through OEM and service-provider channels. The company
  was venture-backed by Battery Ventures. Its web presence at dirig.com carried full
  product, partner, and support content through roughly 2003, degraded to a broken
  holding page under the name "Dirig Corporation" from early 2004, and by late 2006
  the domain was a parked Sedo for-sale page. As of this enrichment pass the company
  has no live website, developer portal, documentation, or API surface of any kind;
  dirig.com now resolves to an unrelated third-party endpoint returning a bare "OK"
  health response. This profile is retained as a historical company record in the
  API Evangelist network — there is nothing to enrich and nothing to score.'
